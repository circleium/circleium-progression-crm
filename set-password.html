<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Circleium CRM Password</title><style>body{font-family:Arial;background:#eef3fb;margin:0}.box{max-width:430px;margin:90px auto;background:white;padding:28px;border-radius:14px;border:1px solid #d9e2ef}img{height:44px;margin-bottom:18px}input{width:100%;padding:11px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #cbd7e4;border-radius:8px}button{background:#062b59;color:white;border:0;padding:11px 16px;border-radius:8px;font-weight:bold}.msg{font-size:12px;margin-top:12px}</style></head><body><div class="box"><img src="circleium-logo.png"><h2>Create your CRM password</h2><p>Choose the password you will use to access your Circleium Partner Workspace.</p><input id="pw" type="password" placeholder="New password"><input id="pw2" type="password" placeholder="Confirm password"><button id="save">Set password</button><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=window.CIRCLEIUM_CONFIG;const sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);document.getElementById('save').onclick=async()=>{const p=document.getElementById('pw').value,p2=document.getElementById('pw2').value,m=document.getElementById('msg');if(p.length<8||p!==p2){m.textContent='Passwords must match and be at least 8 characters.';return;}const {error}=await sb.auth.updateUser({password:p});if(error){m.textContent=error.message;return;}m.textContent='Password set. You can now sign in.';setTimeout(()=>location.href='index.html',1200);};</script></body></html>
